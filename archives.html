<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>全部存档 · Hacker News Daily</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body class="page-archives">
    <div id="hn-top">
      <table>
        <tr>
          <td class="hn-top-brand">
            <span class="hn-logo" aria-hidden="true"></span>
            <span class="hn-brand"><a href="https://news.ycombinator.com/" target="_blank" rel="noopener noreferrer">Hacker News</a></span>
            <span class="hn-pagename">Daily · 全部存档</span>
          </td>
          <td class="hn-top-archive">
            <a class="hn-top-link" href="index.html">返回首页</a>
          </td>
        </tr>
      </table>
    </div>

    <div id="hn-error" hidden></div>

    <div id="hn-main">
      <p id="hn-archive-back" class="archive-back" hidden>
        <a href="archives.html">← 全部存档</a>
        <span id="hn-archive-day-title" class="archive-day-title" hidden></span>
      </p>

      <div id="hn-archive-list-wrap">

      </div>

      <div id="hn-archive-detail" hidden>
        <table class="item-list" id="hn-item-table">
          <tbody id="hn-items"></tbody>
        </table>
      </div>
    </div>

    <div id="hn-footer">
      <div id="hn-meta-line" class="hn-meta-banner"></div>
    </div>

    <script src="archives.js" type="module"></script>
