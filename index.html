<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hacker News Daily · 本地摘要</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <div id="hn-top">
      <table>
        <tr>
          <td class="hn-top-brand">
            <span class="hn-logo" aria-hidden="true"></span>
            <span class="hn-brand"><a>Hacker News</a></span>
            <span class="hn-pagename">Daily</span>
          </td>
          <td class="hn-top-archive">
            <label class="hn-archive-label" for="hn-archive-select">存档</label>
            <select id="hn-archive-select" aria-label="最近 30 天存档"></select>
            <a class="hn-top-link" id="hn-archive-more" href="archives.html">全部存档</a>
          </td>
        </tr>
      </table>
    </div>

    <div id="hn-error" hidden></div>

    <div id="hn-main">
      <table class="item-list" id="hn-item-table">
        <tbody id="hn-items"></tbody>
      </table>
    </div>

    <div id="hn-footer">
      <div id="hn-meta-line" class="hn-meta-banner"></div>
    </div>

    <script src="viewer.js" type="module"></script>
  </body>
</html>
